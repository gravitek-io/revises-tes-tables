# Dependabot configuration.
# Major updates of TypeScript are ignored on purpose: they need a deliberate
# migration (typescript-eslint peer range). Tailwind CSS majors are no longer
# ignored since the v4 migration; still review their visual impact before merging.
# Caution: ignore rules only apply to version updates. Security updates may still
# propose a major bump; check for a patched version within the current major first.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patches:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Node majors are chosen deliberately (LTS lines only, kept in sync with
    # .nvmrc): Dependabot would otherwise propose odd, short-lived releases
    # such as Node 25. Digest refreshes of the current tag still come through.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
