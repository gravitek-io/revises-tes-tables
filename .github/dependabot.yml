# Dependabot configuration.
# Major updates of TypeScript and Tailwind CSS are ignored on purpose: both need a
# deliberate migration (typescript-eslint peer range, Tailwind v4 config/CSS syntax).
# Caution: these ignore rules only apply to version updates. Security updates may
# still propose a major bump (e.g. Tailwind v4 to drop a vulnerable transitive
# dependency); check for a patched version within the current major first.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patches:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Node majors are chosen deliberately (LTS lines only, kept in sync with
    # .nvmrc): Dependabot would otherwise propose odd, short-lived releases
    # such as Node 25. Digest refreshes of the current tag still come through.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
